name: Проверка расписания

on:
  schedule:
    - cron: "*/10 2-15 * * 1-5"
    - cron: "*/10 5-13 * * 0,6"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка Poppler (конвертация PDF → изображение)
        run: sudo apt-get install -y poppler-utils

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install requests pdf2image Pillow

      - name: Запуск проверки расписания
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py

      - name: Сохранить обновлённые хэши
        run: |
          git config user.name  "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add hashes.json
          git diff --staged --quiet || git commit -m "chore: обновление хэшей расписания"
          git push
