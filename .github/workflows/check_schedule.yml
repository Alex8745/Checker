name: Проверка расписания

on:
  schedule:
    # Каждые 10 минут с понедельника по пятницу, 7:00–20:00 МСК (02:00–15:00 UTC)
    - cron: "*/10 2-15 * * 1-5"
    # Суббота и воскресенье — расписание на понедельник, 10:00–18:00 МСК (05:00–13:00 UTC)
    - cron: "*/10 5-13 * * 0,6"
  workflow_dispatch:   # Кнопка ручного запуска на GitHub

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Нужно для коммита hashes.json

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install requests

      - name: Запуск проверки расписания
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py

      - name: Сохранить обновлённые хэши в репозиторий
        run: |
          git config user.name  "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add hashes.json
          git diff --staged --quiet || git commit -m "chore: обновление хэшей расписания"
          git push
