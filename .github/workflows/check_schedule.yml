name: Проверка расписания

on:
  workflow_dispatch:

concurrency:
  group: check-schedule
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка Poppler (конвертация PDF → изображение)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install requests pdf2image Pillow cryptography

      - name: Запуск проверки расписания
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBSCRIBERS_KEY:    ${{ secrets.SUBSCRIBERS_KEY }}
        run: python checker.py

      - name: Сохранить хэши и подписчиков
        run: |
          git config user.name  "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add hashes.json subscribers.enc
          if git diff --staged --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          git commit -m "chore: обновление хэшей и подписчиков"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Попытка $i не удалась, жду 5 секунд..."
            sleep 5
          done
          exit 1
